<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Lankans in NUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --blue: #003d7c;       /* NUS blue */
    --blue-soft: #e8eef6;
    --orange: #ef7c00;     /* NUS orange */
    --orange-soft: #fdf0e1;
    --bg: #ffffff;
    --surface: #f7f9fc;
    --text: #1a2233;
    --muted: #5d6b82;
    --border: #dfe5ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* ---------- Header ---------- */
  header {
    background: var(--bg);
    border-bottom: 4px solid var(--orange);
    padding: 48px 16px 36px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 10px;
    font-size: clamp(1.7rem, 4.5vw, 2.6rem);
    font-weight: 800;
    color: var(--blue);
    letter-spacing: -0.02em;
  }
  header h1 span { color: var(--orange); }
  header p { margin: 0 auto; max-width: 620px; color: var(--muted); line-height: 1.5; }

  main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 56px; }

  /* ---------- Filters ---------- */
  .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
  .controls input, .controls select {
    flex: 1 1 200px;
    padding: 11px 14px;
    font: inherit;
    font-size: .95rem;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  .controls input:focus, .controls select:focus { border-color: var(--blue); }
  .count { color: var(--muted); font-size: .9rem; margin: 0 0 18px; }
  .count b { color: var(--orange); }

  /* ---------- Cards ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(0, 61, 124, .12);
    border-color: var(--blue);
  }
  .photo {
    aspect-ratio: 1 / 1;            /* 1:1 profile pictures */
    width: 100%;
    background: var(--blue-soft);
    position: relative;
    overflow: hidden;
  }
  .photo img {
    position: absolute; inset: 0;   /* sit above the initials fallback */
    z-index: 1;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .initials {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem; font-weight: 700;
    color: var(--blue);
    background: linear-gradient(135deg, var(--blue-soft), var(--orange-soft));
  }
  .info { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .name { font-weight: 700; font-size: 1.05rem; color: var(--blue); line-height: 1.3; }
  .faculty { font-size: .88rem; color: var(--muted); }
  .tag {
    align-self: flex-start;
    margin-top: 2px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: .76rem; font-weight: 600;
    background: var(--orange-soft);
    color: #b35c00;
  }
  .keywords { font-size: .8rem; color: var(--muted); line-height: 1.45; margin-top: 4px; }
  .keywords b { color: var(--text); font-weight: 600; }
  .keywords i { font-style: italic; }
  .linkedin {
    margin-top: auto;
    padding-top: 10px;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: .88rem; font-weight: 600;
    color: var(--blue);
    text-decoration: none;
  }
  .linkedin:hover { color: var(--orange); }
  .linkedin svg { width: 16px; height: 16px; fill: currentColor; }

  .msg {
    grid-column: 1 / -1;
    padding: 40px 16px; text-align: center; color: var(--muted);
    background: var(--surface); border-radius: 12px;
  }
  footer {
    text-align: center; color: var(--muted); font-size: .8rem;
    padding: 20px 16px 32px; border-top: 1px solid var(--border);
  }
</style>
</head>
<body>
<header>
  <h1>Sri Lankans <span>in NUS</span></h1>
  <p>Connect with the Sri Lankan community at the National University of Singapore — reach out for advice on admissions, programmes, scholarships and life in Singapore.</p>
</header>

<main>
  <div class="controls">
    <input id="search" type="search" placeholder="Search by name or research area…">
    <select id="faculty"><option value="">All faculties</option></select>
    <select id="category"><option value="">All categories</option></select>
  </div>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"><div class="msg">Loading…</div></div>
</main>

<footer>Sri Lankans in NUS · Contact and other information above was submitted directly by each individual<span id="updated"></span><span id="version"></span></footer>

<script>
  // data.csv is generated at deploy time by .github/workflows/deploy.yml from the
  // Google Sheet whose link is stored in the SHEET_URL repository secret.
  // Columns: Name | Faculty | Category | LinkedIn | Profile Picture | Research Areas
  const DATA_URL = "data.csv";

  // Sample rows shown when data.csv isn't available (e.g. opening index.html locally)
  const DEMO = [
    { name: "Example Student", faculty: "School of Computing", category: "PhD Student", linkedin: "example-student", photo: "", research: "Machine Learning, Computer Vision" },
    { name: "Another Student", faculty: "College of Design and Engineering", category: "Master's", linkedin: "https://www.linkedin.com/in/another", photo: "", research: "" },
    { name: "Third Student", faculty: "Faculty of Science", category: "Undergraduate", linkedin: "", photo: "", research: "" },
    { name: "Fourth Student", faculty: "NUS Business School", category: "Alumni", linkedin: "fourth", photo: "", research: "" }
  ];

  let data = [];
  const $ = id => document.getElementById(id);

  const esc = s => String(s || "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

  function linkedinUrl(v) {
    v = (v || "").trim();
    if (!v) return "";
    if (/^https?:\/\//i.test(v)) return v;
    if (v.includes("linkedin.com")) return "https://" + v.replace(/^\/+/, "");
    return "https://www.linkedin.com/in/" + v.replace(/^@/, "");
  }

  // Google Drive links (e.g. from a Google Form upload) → list of image URLs to try in order
  function photoUrls(v) {
    v = (v || "").split(",")[0].trim();       // forms may store several files; use the first
    if (!v) return [];
    const m = v.match(/drive\.google\.com\/(?:open\?(?:[^#]*&)?id=|file\/d\/|uc\?(?:[^#]*&)?id=|thumbnail\?(?:[^#]*&)?id=)([a-zA-Z0-9_-]{10,})/)
           || v.match(/docs\.google\.com\/(?:uc|open)\?(?:[^#]*&)?id=([a-zA-Z0-9_-]{10,})/);
    if (m) return [
      `https://drive.google.com/thumbnail?id=${m[1]}&sz=w500`,
      `https://lh3.googleusercontent.com/d/${m[1]}=w500`,
      `https://drive.google.com/uc?export=view&id=${m[1]}`
    ];
    return /^https?:\/\//i.test(v) ? [v]
         : /\.(jpe?g|png|webp|gif)$/i.test(v) ? [`photos/${v.replace(/^\/?(photos\/)?/i, "")}`]   // file in the repo's photos/ folder
         : [];
  }

  // If an image fails, try the next address; if all fail, show initials
  window.nextPhoto = img => {
    const rest = JSON.parse(img.dataset.rest || "[]");
    if (rest.length) { img.dataset.rest = JSON.stringify(rest.slice(1)); img.src = rest[0]; }
    else img.remove();
  };

  // "ML; NLP, HCI" → ["ML", "NLP", "HCI"]
  const areas = v => (v || "").split(/[,;\n]+/).map(s => s.trim()).filter(Boolean);

  const initials = name => name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();

  // Match a column even if the header is written slightly differently
  function pick(row, ...names) {
    for (const k of Object.keys(row)) {
      const key = k.toLowerCase().replace(/[^a-z]/g, "");
      if (names.some(n => key.includes(n))) return (row[k] || "").trim();
    }
    return "";
  }

  const LI_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>';

  function card(d) {
    const li = linkedinUrl(d.linkedin);
    const pics = photoUrls(d.photo);
    return `<article class="card">
      <div class="photo">
        <div class="initials">${esc(initials(d.name))}</div>
        ${pics.length ? `<img src="${esc(pics[0])}" data-rest='${esc(JSON.stringify(pics.slice(1)))}' alt="${esc(d.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="nextPhoto(this)">` : ""}
      </div>
      <div class="info">
        <div class="name">${esc(d.name)}</div>
        ${d.faculty ? `<div class="faculty">${esc(d.faculty)}</div>` : ""}
        ${d.category ? `<span class="tag">${esc(d.category)}</span>` : ""}
        ${areas(d.research).length ? `<div class="keywords"><b>Research areas:</b> <i>${areas(d.research).map(esc).join(", ")}</i></div>` : ""}
        ${li ? `<a class="linkedin" href="${esc(li)}" target="_blank" rel="noopener">${LI_ICON} Connect on LinkedIn</a>` : ""}
      </div>
    </article>`;
  }

  function render() {
    const q = $("search").value.toLowerCase();
    const fac = $("faculty").value;
    const cat = $("category").value;
    const list = data
      .filter(d => (d.name + " " + d.research).toLowerCase().includes(q)
        && (!fac || d.faculty === fac)
        && (!cat || d.category === cat))
      .sort((a, b) => a.name.localeCompare(b.name));

    const people = n => n === 1 ? "person" : "people";
    $("count").innerHTML = (q || fac || cat)
      ? `<b>${list.length}</b> of ${data.length} ${people(data.length)}`
      : `<b>${data.length}</b> ${people(data.length)}`;
    $("grid").innerHTML = list.length
      ? list.map(card).join("")
      : `<div class="msg">No one matches your search.</div>`;
  }

  function fillSelect(id, label, key) {
    const opts = [...new Set(data.map(d => d[key]).filter(Boolean))].sort();
    $(id).innerHTML = `<option value="">${label}</option>` + opts.map(o => `<option>${esc(o)}</option>`).join("");
  }

  function load(list) {
    data = list.filter(d => d.name);
    fillSelect("faculty", "All faculties", "faculty");
    fillSelect("category", "All categories", "category");
    render();
  }

  ["search", "faculty", "category"].forEach(id =>
    $(id).addEventListener(id === "search" ? "input" : "change", render));

  Papa.parse(DATA_URL + "?t=" + Date.now(), {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: res => load(res.data.map(r => ({
      name:     pick(r, "name"),
      faculty:  pick(r, "faculty", "school", "college"),
      category: pick(r, "category", "categ"),
      linkedin: pick(r, "linkedin", "linked"),
      photo:    pick(r, "profilepic", "picture", "photo", "image"),
      research: pick(r, "research")
    }))),
    error: () => load(DEMO)
  });

  // updated.txt holds the time the deploy workflow last pulled the sheet (ISO, UTC)
  fetch("updated.txt?t=" + Date.now())
    .then(r => r.ok ? r.text() : "")
    .then(t => {
      const when = new Date(t.trim());
      if (!t || isNaN(when)) return;
      $("updated").textContent = " · Last updated " + when.toLocaleString("en-SG", { dateStyle: "medium", timeStyle: "short" });
    })
    .catch(() => {});
</script>
</body>
</html>
