<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Lankan Students in NUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  /* ============================================================
     1. PASTE YOUR GOOGLE SHEET CSV LINK IN THE SCRIPT BELOW
        (search for SHEET_CSV_URL)
     ============================================================ */
  :root {
    --maroon: #8d153a;
    --gold: #f4b400;
    --green: #00534e;
    --bg: #f7f5f2;
    --card: #ffffff;
    --text: #1f1f1f;
    --muted: #6b6b6b;
    --border: #e6e1da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141212;
      --card: #1e1b1b;
      --text: #f2eeee;
      --muted: #a8a0a0;
      --border: #332e2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: linear-gradient(135deg, var(--maroon), #5e0d27);
    color: #fff;
    padding: 48px 16px 40px;
    text-align: center;
    border-bottom: 5px solid var(--gold);
  }
  header h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 4vw, 2.4rem); }
  header p { margin: 0; opacity: .85; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
  }
  .controls input, .controls select {
    flex: 1 1 220px;
    padding: 10px 12px;
    font: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
  }
  .count { color: var(--muted); font-size: .9rem; margin-bottom: 10px; }
  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 16px; text-align: left; }
  th {
    background: var(--green); color: #fff;
    font-weight: 600; font-size: .9rem; cursor: pointer; user-select: none;
    white-space: nowrap;
  }
  tr + tr td { border-top: 1px solid var(--border); }
  tbody tr:hover { background: rgba(244,180,0,.08); }
  a { color: var(--maroon); font-weight: 500; text-decoration: none; }
  @media (prefers-color-scheme: dark) { a { color: var(--gold); } }
  a:hover { text-decoration: underline; }
  .tag {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: .8rem; font-weight: 600;
    background: rgba(0,83,78,.12); color: var(--green);
  }
  @media (prefers-color-scheme: dark) { .tag { color: #6fd3c9; } }
  .msg { padding: 32px; text-align: center; color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding-bottom: 24px; }
</style>
</head>
<body>
<header>
  <h1>Sri Lankan Students in NUS</h1>
  <p>Connect with the Sri Lankan community at the National University of Singapore</p>
</header>

<main>
  <div class="controls">
    <input id="search" type="search" placeholder="Search by name…">
    <select id="category"><option value="">All categories</option></select>
  </div>
  <div class="count" id="count"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-key="name">Name ↕</th>
          <th data-key="linkedin">LinkedIn</th>
          <th data-key="category">Category ↕</th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="3" class="msg">Loading…</td></tr></tbody>
    </table>
  </div>
</main>
<footer>Data updates automatically from Google Sheets.</footer>

<script>
  // ▼▼▼ PASTE YOUR PUBLISHED GOOGLE SHEET CSV LINK HERE ▼▼▼
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1dKzNY3j7otRH9wIkrLoU62bAjMNGCgtg280JjFKDhcw/edit?usp=sharing";
  // ▲▲▲ Sheet columns must be: Name | LinkedIn | Category ▲▲▲

  const DEMO = [
    { name: "Example Student", linkedin: "example-student", category: "Undergraduate" },
    { name: "Another Student", linkedin: "https://www.linkedin.com/in/another", category: "PhD" },
    { name: "Third Student", linkedin: "", category: "Alumni" }
  ];

  let data = [], sortKey = "name", sortAsc = true;
  const $ = id => document.getElementById(id);

  function linkedinUrl(v) {
    v = (v || "").trim();
    if (!v) return "";
    if (/^https?:\/\//i.test(v)) return v;
    if (v.includes("linkedin.com")) return "https://" + v.replace(/^\/+/, "");
    return "https://www.linkedin.com/in/" + v.replace(/^@/, "");
  }
  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }
  // Find a column even if the header is spelled slightly differently
  function pick(row, ...names) {
    for (const k of Object.keys(row)) {
      const key = k.toLowerCase().replace(/[^a-z]/g, "");
      if (names.some(n => key.includes(n))) return (row[k] || "").trim();
    }
    return "";
  }

  function render() {
    const q = $("search").value.toLowerCase();
    const cat = $("category").value;
    const rows = data
      .filter(d => d.name.toLowerCase().includes(q) && (!cat || d.category === cat))
      .sort((a, b) => (sortAsc ? 1 : -1) * a[sortKey].localeCompare(b[sortKey]));

    $("count").textContent = `${rows.length} student${rows.length === 1 ? "" : "s"}`;
    $("rows").innerHTML = rows.length ? rows.map(d => {
      const url = linkedinUrl(d.linkedin);
      return `<tr>
        <td>${esc(d.name)}</td>
        <td>${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">View profile</a>` : "—"}</td>
        <td>${d.category ? `<span class="tag">${esc(d.category)}</span>` : "—"}</td>
      </tr>`;
    }).join("") : `<tr><td colspan="3" class="msg">No students found.</td></tr>`;
  }

  function load(list) {
    data = list.filter(d => d.name);
    const cats = [...new Set(data.map(d => d.category).filter(Boolean))].sort();
    $("category").innerHTML = `<option value="">All categories</option>` +
      cats.map(c => `<option>${esc(c)}</option>`).join("");
    render();
  }

  $("search").addEventListener("input", render);
  $("category").addEventListener("change", render);
  document.querySelectorAll("th[data-key]").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.key;
    if (k === "linkedin") return;
    sortAsc = sortKey === k ? !sortAsc : true;
    sortKey = k;
    render();
  }));

  // Turn a normal share/edit link into a CSV link automatically
  function toCsvUrl(url) {
    if (/output=csv|format=csv|out:csv/.test(url)) return url;
    const m = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
    if (m && m[1] !== "e") {
      const gid = (url.match(/[#&?]gid=(\d+)/) || [])[1];
      return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv` + (gid ? `&gid=${gid}` : "");
    }
    return url;
  }

  const showError = text =>
    $("rows").innerHTML = `<tr><td colspan="3" class="msg">${text}</td></tr>`;

  if (SHEET_CSV_URL.startsWith("http")) {
    const csvUrl = toCsvUrl(SHEET_CSV_URL);
    Papa.parse(csvUrl + (csvUrl.includes("?") ? "&" : "?") + "t=" + Date.now(), {
      download: true,
      header: true,
      skipEmptyLines: true,
      beforeFirstChunk: chunk => {
        if (/^\s*<(!doctype|html)/i.test(chunk)) {
          showError("The sheet link returned a web page, not data. Publish it as CSV, or set sharing to “Anyone with the link – Viewer”.");
          return "";
        }
      },
      complete: res => res.data.length && load(res.data.map(r => ({
        name: pick(r, "name"),
        linkedin: pick(r, "linkedin", "linked"),
        category: pick(r, "category", "categ")
      }))),
      error: () => showError("Couldn't load the sheet. Check it's published to the web as CSV.")
    });
  } else {
    load(DEMO); // shows sample rows until you paste your sheet link
  }
</script>
</body>
</html>
