name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"   # refresh data from the sheet every hour
  workflow_dispatch:       # "Run workflow" button for an instant refresh

permissions:
  contents: write   # lets the workflow commit the bumped VERSION back and create releases
  pages: write
  id-token: write

jobs:
  # On every push, bump the patch number in VERSION (0.1.0 → 0.1.1), commit it back, and
  # publish a GitHub Release tagged v<version>. Pushes made by this workflow don't trigger
  # another run. To change major/minor, edit VERSION yourself (e.g. 0.2.0) — a push that
  # edits VERSION is released as-is. This job has no concurrency group, so a form-triggered
  # rebuild can't cancel it halfway.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git diff --name-only "$BEFORE" HEAD 2>/dev/null | grep -qx VERSION; then
            echo "VERSION edited in this push, keeping $(cat VERSION)"; exit 0
          fi
          IFS=. read -r major minor patch < VERSION
          echo "$major.$minor.$((patch + 1))" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to $(cat VERSION)"
          git push

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"; exit 0
          fi
          # Notes: commits since the previous tag, leaving out the automatic bump commits
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          git log --format='- %s (%h)' ${PREV:+$PREV..}HEAD | grep -v 'chore: bump version' > notes.md || true
          gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG" --notes-file notes.md

  build:
    needs: release
    # Run after `release` on pushes, and on its own for schedule / form / manual runs
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest main, including the version bump just pushed

      # The sheet link lives in the SHEET_URL repository secret, so it never appears in the
      # public repo or site. Only the columns below are copied into the published data.csv
      # (emails, timestamps etc. from the form are dropped).
      - name: Download sheet and keep only public columns
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: |
          if [ -z "$SHEET_URL" ]; then echo "::error::SHEET_URL secret is not set"; exit 1; fi
          mkdir -p site
          cp index.html site/
          sed -i "s|<span id=\"version\"></span>| · v$(tr -d '[:space:]' < VERSION)|" site/index.html
          date -u +%Y-%m-%dT%H:%M:%SZ > site/updated.txt
          [ -d photos ] && cp -r photos site/
          python3 - <<'EOF'
          import csv, io, os, re, sys, urllib.request

          url = os.environ["SHEET_URL"].strip()
          # Accept a normal share link as well as a published CSV link
          if not re.search(r"output=csv|format=csv|out:csv", url):
              m = re.search(r"/spreadsheets/d/([a-zA-Z0-9_-]+)", url)
              if m and m.group(1) != "e":
                  gid = re.search(r"[#&?]gid=(\d+)", url)
                  url = f"https://docs.google.com/spreadsheets/d/{m.group(1)}/export?format=csv" + (f"&gid={gid.group(1)}" if gid else "")

          text = urllib.request.urlopen(url).read().decode("utf-8-sig")
          if re.match(r"\s*<(!doctype|html)", text, re.I):
              sys.exit("The link returned a web page, not CSV. Set sharing to 'Anyone with the link - Viewer', or use the published CSV link.")
          rows = list(csv.DictReader(io.StringIO(text)))

          # Match a column even if the header is written slightly differently
          def pick(row, *keys):
              for k, v in row.items():
                  kk = "".join(c for c in (k or "").lower() if c.isalpha())
                  if any(x in kk for x in keys):
                      return (v or "").strip()
              return ""

          cols = {
              "Name":           ("name",),
              "Faculty":        ("faculty", "school", "college"),
              "Category":       ("category", "categ"),
              "LinkedIn":       ("linkedin", "linked"),
              "Profile Picture": ("profilepic", "picture", "photo", "image"),
              "Research Areas": ("research",),
          }
          n = 0
          with open("site/data.csv", "w", encoding="utf-8", newline="") as f:
              w = csv.writer(f)
              w.writerow(cols)
              for r in rows:
                  out = [pick(r, *keys) for keys in cols.values()]
                  if out[0]:
                      w.writerow(out)
                      n += 1
          print(f"{n} rows written")
          if n == 0:
              sys.exit("No rows found - check the sheet's column headers")
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
